# C 端前端容器（flash-frontend/dist）—— 全量 compose 部署专用
#
# 必须有这份配置：nginx:alpine 的默认配置只会把请求当静态文件找，
# 前端 axios 走相对路径 /api/**，于是页面能打开、接口全 404。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由：直接访问 /orders 或刷新深层路由都要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口与图片统一交给网关（网关再按路由转发到 flash-api / flash-admin）
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }
}
