global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 全量容器化部署（docker-compose.full.yml）专用。
# 与 prometheus.yml 的差别：
#   1. flash-api / flash-admin 的 targets 由 host.docker.internal:808X 改为容器名；
#   2. 放开 flash-gateway 与 rocketmq-broker 两个 job（本地开发时它们不存在，会造成 DOWN 噪音）。
# 用法见 README「方式一」与 docs/deployment/full-container.md。
scrape_configs:
  - job_name: 'flash-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8081']
        labels:
          service: 'flash-api'

  - job_name: 'flash-admin'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['admin:8082']
        labels:
          service: 'flash-admin'

  - job_name: 'flash-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: 'flash-gateway'

  - job_name: 'rocketmq-broker'
    static_configs:
      - targets: ['rocketmq-broker:5557']
        labels:
          service: 'rocketmq-broker'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['flash-node-exporter:9100']
