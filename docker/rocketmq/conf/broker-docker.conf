brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = SYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
# 全量容器化部署专用：broker 向 namesrv 注册的必须是容器名。
# 用宿主机开发那套 broker.conf（brokerIP1 = 127.0.0.1）时，api/admin 容器拿到的
# broker 地址会指向它们自己，消费者启动即连不上。
brokerIP1 = rocketmq-broker
metricsExporterEnable=true
metricsExporterType=PROMETHEUS
metricsPrometheusExporterPort=5557
