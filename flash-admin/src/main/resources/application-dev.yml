# ==================== 开发环境配置 ====================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 使用默认 public 命名空间，重启不丢失
        username: nacos
        password: nacos
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      redisson:
        config: |
          threads: 16
          nettyThreads: 32
          singleServerConfig:
            address: "redis://127.0.0.1:6379"
            connectionMinimumIdleSize: 8
            connectionPoolSize: 32

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: flash-sale-secret-key-min-256-bits-long-for-hs256
  expiration: 1800000
  refresh-expiration: 604800000

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: flash-admin-producer-group
  consumer:
    group: flash-admin-consumer-group

flash:
  flash:
    consumer:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,beans
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
