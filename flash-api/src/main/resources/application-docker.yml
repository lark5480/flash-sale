# ==================== Docker 容器环境配置 ====================
# 使用容器名作为 host，Compose 网络自动解析
spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        # 使用默认 public 命名空间，重启不丢失
        username: nacos
        password: nacos
    sentinel:
      transport:
        dashboard: flash-sentinel-dashboard:8858
      eager: true
      port: 8719
  datasource:
    url: jdbc:mysql://mysql:3306/flash_sale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: redis
      port: 6379

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: flash-sale-secret-key-min-256-bits-long-for-hs256
  expiration: 1800000
  refresh-expiration: 604800000

rocketmq:
  name-server: rocketmq-namesrv:9876
  producer:
    group: flash-api-producer-group
    send-message-timeout: 10000
  consumer:
    group: flash-order-consumer-group

flash:
  flash:
    consumer:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
