# ==================== Docker 容器环境配置 ====================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        # 使用默认 public 命名空间，重启不丢失
        username: nacos
        password: nacos

jwt:
  # 本地/容器编排零配置可用：默认值与 dev 同一把仅本地 key（开源 demo 的可接受边界）。
  # 真部署走 prod profile，那里 ${JWT_SECRET} 无默认值，缺失即启动失败。
  secret: ${JWT_SECRET:flash-sale-secret-key-min-256-bits-long-for-hs256}
  expiration: 1800000
  refresh-expiration: 604800000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
