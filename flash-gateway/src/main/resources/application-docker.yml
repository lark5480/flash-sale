# ==================== Docker 容器环境配置 ====================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        # 使用默认 public 命名空间，重启不丢失
        username: nacos
        password: nacos

jwt:
  secret: flash-sale-secret-key-min-256-bits-long-for-hs256
  expiration: 1800000
  refresh-expiration: 604800000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
